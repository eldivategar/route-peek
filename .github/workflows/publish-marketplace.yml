name: Publish to VS Code Marketplace

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PUBLISH to confirm publishing to VS Code Marketplace'
        required: true
        type: string
        default: 'CANCEL'

permissions:
  contents: read

jobs:
  publish-marketplace:
    name: Publish VSIX to Marketplace
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'PUBLISH'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Quality Suite
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npm run package:validate

      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::VSCE_PAT secret is missing or empty. Configure this in GitHub repository secrets."
            exit 1
          fi
          # Publish using official @vscode/vsce tool
          # Note: Microsoft PAT retirement advisory 2026: Azure DevOps global PATs sunset Dec 1, 2026.
          # Use publisher-scoped PAT or Microsoft Entra ID authentication.
          npx @vscode/vsce publish --packagePath route-peek-*.vsix --no-dependencies -p "$VSCE_PAT"
